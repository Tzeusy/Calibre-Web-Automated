apiVersion: v1
kind: Service
metadata:
  name: {{ include "calibre-web-automated.fullname" . }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8083
      protocol: TCP
      name: http
  selector:
    app: {{ include "calibre-web-automated.name" . }}
